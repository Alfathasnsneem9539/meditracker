<!DOCTYPE html>
<html>

<head>
    <title>Login - CareSync</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body style="align-items: center;">

    <div class="mobile-container"
        style="display: flex; flex-direction: column; justify-content: center; padding-bottom: 0;">
        <div class="content" style="text-align: center;">
            <h1 style="color: #4facfe;">CareSync</h1>
            <p>Your Health Companion</p>

            <div class="form-container">
                <input type="email" id="email" placeholder="Enter Email">
                <input type="password" id="password" placeholder="Enter Password">

                <button class="primary-btn" onclick="login()">Login</button>

                <p style="margin-top: 20px;">Don't have an account?
                    <a href="register.html"
                        style="color: #4facfe; text-decoration: none; font-weight: bold;">Register</a>
                </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
