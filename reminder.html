<!DOCTYPE html>
<html>

<head>
    <title>Reminders - CareSync</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="mobile-container">

        <div class="header">
            <h2>⏰ Reminders</h2>
            <button onclick="window.location.href='dashboard.html'"><i class="fas fa-arrow-left"></i></button>
        </div>

        <div class="content">
            <div class="timeline-section">
                <h3>Active Reminders</h3>

                <!-- Reminder Item -->
                <div class="timeline-item">
                    <div class="timeline-time">08:00 AM</div>
                    <div class="timeline-card">
                        <h4>Aspirin</h4>
                        <p>Take after food</p>
                        <div style="margin-top: 10px; display: flex; gap: 10px;">
                            <button
                                style="background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;"
                                onclick="alert('Marked as Taken')">Taken</button>
                            <button
                                style="background: #ffc107; color: black; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;"
                                onclick="alert('Caregiver Notified: Medicine Skipped')">Skip</button>
                        </div>
                    </div>
                </div>

                <!-- Reminder Item -->
                <div class="timeline-item">
                    <div class="timeline-time">09:00 PM</div>
                    <div class="timeline-card">
                        <h4>Metformin</h4>
                        <p>Take after dinner</p>
                        <div style="margin-top: 10px; display: flex; gap: 10px;">
                            <button
                                style="background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;"
                                onclick="alert('Marked as Taken')">Taken</button>
                            <button
                                style="background: #ffc107; color: black; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;"
                                onclick="alert('Caregiver Notified: Medicine Skipped')">Skip</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="medicine.html" class="nav-item">
                <i class="fas fa-pills"></i>
                <span>Medicines</span>
            </a>
            <a href="health_record.html" class="nav-item">
                <i class="fas fa-file-medical"></i>
                <span>Records</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
